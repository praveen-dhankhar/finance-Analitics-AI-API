name: Deploy Dev

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (dev)
        run: railway up --service $RAILWAY_DEV_SERVICE_ID
        working-directory: Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_DEV_SERVICE_ID: ${{ secrets.RAILWAY_DEV_SERVICE_ID }}

      - name: Wait for rollout
        run: sleep 20

      - name: Health check
        run: curl -f $DEV_URL/api/health
        env:
          DEV_URL: ${{ secrets.DEV_URL }}
