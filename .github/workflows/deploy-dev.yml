name: Deploy Dev

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Railway (dev)
        run: railway up --service $RAILWAY_DEV_SERVICE_ID
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_DEV_SERVICE_ID: ${{ secrets.RAILWAY_DEV_SERVICE_ID }}

      - name: Wait for rollout
        run: sleep 20

      - name: Health check
        run: curl -f $DEV_URL/api/health
        env:
          DEV_URL: ${{ secrets.DEV_URL }}
